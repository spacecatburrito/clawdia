[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawdia"
dynamic = ["version"]
description = "Personal Telegram capture bot that shelves what the owner sends and hands work items to Second"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiogram>=3.14",
    "httpx>=0.27",
    "anthropic>=2.3",
    "openai>=3.41",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
clawdia = "clawdia.cli:main"

[tool.hatch.version]
path = "src/clawdia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clawdia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
